[project]
name = "sextant"
version = "0.1.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pymupdf>=1.28",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
sextant = "sextant.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
# 1.27 is the first to read the SPDX `license` expression above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: spends money against the real Anthropic API"]
# importlib import mode lets test files share a basename across
# directories (tests/test_models.py and tests/refs/test_models.py).
addopts = "-m 'not live' --import-mode=importlib"
